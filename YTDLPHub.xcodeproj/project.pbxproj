			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -euo pipefail\n\n# The Python standard library ships once per xcframework slice, and\n# lib-dynload holds ~70 binary extension modules built for one architecture\n# each (*.cpython-3x-iphoneos.so vs *-iphonesimulator.so). A single copied\n# folder cannot serve both, so the matching slice is installed here.\n\ncase \"${PLATFORM_NAME}\" in\n  iphoneos)        SLICE=\"ios-arm64\" ;;\n  iphonesimulator) SLICE=\"ios-arm64_x86_64-simulator\" ;;\n  *) echo \"error: unsupported platform ${PLATFORM_NAME}\"; exit 1 ;;\nesac\n\nSRC=\"$(find \"${PROJECT_DIR}/Vendor/Python.xcframework/${SLICE}/lib\" -maxdepth 1 -type d -name \"python3.*\" 2>/dev/null | head -1)\"\nif [ -z \"${SRC}\" ] || [ ! -f \"${SRC}/encodings/__init__.py\" ]; then\n  echo \"error: no Python standard library for ${SLICE}. Run Scripts/fetch-python.sh.\"\n  exit 1\nfi\n\nDEST=\"${CODESIGNING_FOLDER_PATH}/python-stdlib\"\nmkdir -p \"${DEST}\"\nrsync -a --delete \"${SRC}/\" \"${DEST}/\"\n\n# Binary modules must carry the app's signature to load on a device.\nif [ \"${CODE_SIGNING_REQUIRED:-NO}\" = \"YES\" ] && [ -n \"${EXPANDED_CODE_SIGN_IDENTITY:-}\" ]; then\n  find \"${DEST}\" -name \"*.so\" -print0 | while IFS= read -r -d \"\" module; do\n    codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" \\\n      --preserve-metadata=identifier,entitlements,flags \"${module}\"\n  done\nfi\n";
		};
